    <style>
        :root {
            /* Base Editorial Cálida + Azul Noche Profundo */
            --bg-paper: #fbf9f5;
            --bg-sand: #f2ede4;
            --bg-white: #ffffff;
            
            --navy-primary: #0a1128;
            --navy-secondary: #1e293b;
            --navy-body: #2c384f;
            --navy-muted: #5b6880;
            --border-subtle: #e2dcd0;
            --border-navy: rgba(10, 17, 40, 0.12);
            
            /* Acento Metálico Sobrio */
            --brass: #9a7b4f;
            --brass-light: #c5a880;

            /* Paleta "Celebration" México & Colombia (Acentos discretos) */
            --mx-rosa: #e11d74;      /* Rosa mexicano / Bugambilia */
            --co-oro: #eab308;       /* Amarillo cempasúchil / Oro */
            --co-caribe: #0284c7;    /* Azul caribe / Talavera */
            --mx-esmeralda: #059669; /* Verde esmeralda */
            --latam-coral: #ea580c;  /* Terracota / Coral vivo */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-paper);
            color: var(--navy-body);
            line-height: 1.75;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, .brand-logo {
            font-family: 'Newsreader', Georgia, serif;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--navy-primary);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 28px;
        }

        /* Micro-franja superior estilo esfera Celebration */
        .celebration-bar {
            height: 3px;
            width: 100%;
            background: linear-gradient(
                90deg,
                var(--mx-rosa) 0%,
                var(--mx-rosa) 20%,
                var(--co-oro) 20%,
                var(--co-oro) 40%,
                var(--co-caribe) 40%,
                var(--co-caribe) 60%,
                var(--mx-esmeralda) 60%,
                var(--mx-esmeralda) 80%,
                var(--latam-coral) 80%,
                var(--latam-coral) 100%
            );
        }

        /* Header con sutil elevación */
        header {
            padding: 10px 0 20px;
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            background-color: rgba(251, 249, 245, 0.96);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(10, 17, 40, 0.03);
            z-index: 100;
        }

        .bsd-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 4px;
        }

        .bsd-mark {
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            color: var(--navy-muted);
            font-weight: 600;
            user-select: none;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.65rem;
            line-height: 1;
            color: var(--navy-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: baseline;
        }

        .brand-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--mx-rosa);
            margin: 0 2px;
        }

        .brand-logo span.tld {
            color: var(--navy-muted);
            font-weight: 500;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav a {
            color: var(--navy-secondary);
            text-decoration: none;
            font-size: 0.88rem;
            line-height: 1;
            transition: color 0.25s ease;
            font-weight: 500;
        }

        nav a:hover {
            color: var(--navy-primary);
            text-decoration: underline;
            text-underline-offset: 6px;
            text-decoration-color: var(--co-caribe);
        }

        /* Botón compacto exclusivo para móvil/tablet vertical */
        .mobile-cta {
            display: none;
            background-color: var(--navy-primary);
            color: var(--bg-paper);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 2px;
            box-shadow: 0 2px 8px rgba(10, 17, 40, 0.14);
        }

        /* Hero Section con textura y profundidad sutil */
        .hero {
            padding: 92px 0 92px;
            border-bottom: 1px solid var(--border-subtle);
            background: radial-gradient(circle at 85% 20%, rgba(197, 168, 128, 0.11) 0%, rgba(251, 249, 245, 0) 60%),
                        linear-gradient(180deg, #fbf9f5 0%, #f6f2ea 100%);
            position: relative;
        }

        .eyebrow-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .celebration-dots {
            display: inline-flex;
            gap: 5px;
            align-items: center;
        }

        .celebration-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        .eyebrow {
            color: var(--navy-muted);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-size: 0.76rem;
            font-weight: 600;
        }

        .hero h1 {
            font-size: clamp(2.25rem, 4.5vw, 3.55rem);
            line-height: 1.15;
            max-width: 860px;
            margin-bottom: 26px;
            color: var(--navy-primary);
        }

        .hero p {
            font-size: 1.12rem;
            color: var(--navy-body);
            max-width: 720px;
            margin-bottom: 42px;
            font-weight: 400;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-block;
            background-color: var(--navy-primary);
            color: var(--bg-paper);
            padding: 15px 32px;
            font-weight: 500;
            text-decoration: none;
            font-size: 0.92rem;
            letter-spacing: 0.02em;
            transition: all 0.25s ease;
            border: 1px solid var(--navy-primary);
            box-shadow: 0 6px 18px rgba(10, 17, 40, 0.16);
        }

        .btn-primary:hover {
            background-color: var(--navy-secondary);
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(10, 17, 40, 0.22);
        }

        .presence-badge {
            font-size: 0.85rem;
            color: var(--navy-muted);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 8px 14px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 2px 8px rgba(10, 17, 40, 0.03);
        }

        .presence-badge strong {
            color: var(--navy-primary);
            font-weight: 600;
        }

        /* Secciones */
        .section-paper {
            background-color: var(--bg-paper);
            padding: 96px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .section-sand {
            background-color: var(--bg-sand);
            padding: 96px 0;
            border-bottom: 1px solid var(--border-subtle);
            box-shadow: inset 0 6px 18px rgba(10, 17, 40, 0.025);
        }

        .section-header {
            max-width: 740px;
            margin-bottom: 56px;
        }

        .section-header h2 {
            font-size: clamp(1.95rem, 3.2vw, 2.65rem);
            margin-bottom: 16px;
            line-height: 1.2;
            color: var(--navy-primary);
        }

        .section-header p {
            color: var(--navy-body);
            font-size: 1.05rem;
        }

        /* Grid Editorial con Relieve */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .card {
            background-color: var(--bg-white);
            border: 1px solid var(--border-subtle);
            border-top: 3px solid var(--navy-primary);
            padding: 38px 32px;
            position: relative;
            box-shadow: 0 8px 24px rgba(10, 17, 40, 0.055), 0 1px 3px rgba(10, 17, 40, 0.04);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-top-color 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 36px rgba(10, 17, 40, 0.1), 0 4px 10px rgba(10, 17, 40, 0.05);
        }

        .card-header-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .dial-marker {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 0 3px rgba(10, 17, 40, 0.04);
        }

        .card-tag {
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 0.11em;
            color: var(--navy-muted);
            font-weight: 600;
        }

        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 14px;
            line-height: 1.28;
            color: var(--navy-primary);
        }

        .card h3 span.term-en {
            display: block;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--brass);
            letter-spacing: 0.03em;
            margin-top: 4px;
        }

        .card p {
            color: var(--navy-body);
            font-size: 0.96rem;
        }

        /* Metodología (Bloque Azul Noche con Profundidad) */
        .methodology-box {
            background: linear-gradient(135deg, #0a1128 0%, #121d42 100%);
            color: var(--bg-paper);
            padding: 54px;
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 48px;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 22px 48px rgba(10, 17, 40, 0.18), 0 4px 12px rgba(10, 17, 40, 0.1);
        }

        .methodology-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(
                180deg,
                var(--mx-rosa) 0%,
                var(--co-oro) 33%,
                var(--co-caribe) 66%,
                var(--mx-esmeralda) 100%
            );
        }

        .methodology-box h3 {
            font-size: 1.9rem;
            margin-bottom: 18px;
            color: var(--bg-paper);
            line-height: 1.22;
        }

        .methodology-box p {
            color: #cbd5e1;
            margin-bottom: 16px;
            font-size: 0.98rem;
            font-weight: 300;
        }

        .methodology-list {
            list-style: none;
        }

        .methodology-list li {
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            font-size: 0.94rem;
            display: flex;
            gap: 12px;
            align-items: baseline;
        }

        .methodology-list li:last-child {
            border-bottom: none;
        }

        .step-num {
            font-family: 'Newsreader', Georgia, serif;
            font-weight: 600;
            font-size: 1.08rem;
        }

        /* Contact Section */
        .contact-section {
            text-align: center;
            background: linear-gradient(180deg, #f2ede4 0%, #eae3d6 100%);
            padding: 96px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .contact-section h2 {
            font-size: clamp(1.95rem, 3.2vw, 2.6rem);
            margin-bottom: 18px;
            color: var(--navy-primary);
        }

        .contact-section p {
            color: var(--navy-body);
            max-width: 630px;
            margin: 0 auto 38px;
            font-size: 1.04rem;
        }

        .contact-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .btn-outline {
            display: inline-block;
            border: 1px solid var(--navy-primary);
